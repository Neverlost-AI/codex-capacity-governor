services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: capacity_governor
      POSTGRES_PASSWORD: capacity_governor
      POSTGRES_USER: capacity_governor
    healthcheck:
      test:
        ["CMD-SHELL", "pg_isready -U capacity_governor -d capacity_governor"]
      interval: 2s
      timeout: 5s
      retries: 15
    ports:
      - "5432:5432"
    volumes:
      - capacity-governor-postgres:/var/lib/postgresql/data

volumes:
  capacity-governor-postgres:
